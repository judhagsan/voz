[package]
name = "voz"
version = "0.2.0"
edition = "2021"
authors = ["Judhá Santos <judhagsan@gmail.com>"]
description = "Orquestrador de voz e despachante nativo para terminal e hooks de IA"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1.0"
libc = "0.2"
regex = "1.10"

[[bin]]
name = "voz"
path = "src/main.rs"
