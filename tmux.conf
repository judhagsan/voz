# ~/.tmux.conf — aparência no tema Dracula (https://draculatheme.com)
#
# Paleta:
#   fundo      #282a36    linha atual #44475a    texto   #f8f8f2
#   comentário #6272a4    roxo        #bd93f9    rosa    #ff79c6
#   verde      #50fa7b    amarelo     #f1fa8c    laranja #ffb86c
#   vermelho   #ff5555    ciano       #8be9fd

# --- Cores ---------------------------------------------------------------

# terminfo próprio do tmux e truecolor (o Terminal.app anuncia
# COLORTERM=truecolor), para as cores hex saírem exatas
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# --- Barra de status -----------------------------------------------------

set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#282a36,fg=#f8f8f2"

# Esquerda: nome da sessão; o bloco fica rosa enquanto o prefixo está ativo
set -g status-left-length 30
set -g status-left "#{?client_prefix,#[bg=#ff79c6],#[bg=#bd93f9]}#[fg=#282a36,bold] #S #[default] "

# Janelas: número em cinza, nome em branco; vermelho quando toca o sino;
# "↕" quando um painel está em zoom
set -g window-status-separator ""
set -g window-status-format "#[fg=#6272a4] #I #{?window_bell_flag,#[fg=#ff5555],#[fg=#f8f8f2]}#W#{?window_zoomed_flag, ↕,} "
set -g window-status-current-format "#[bg=#44475a,fg=#ff79c6,bold] #I #[fg=#f8f8f2]#W#{?window_zoomed_flag, ↕,} "

# Direita: data e hora
set -g status-right-length 40
set -g status-right "#[bg=#44475a,fg=#f8f8f2] %d/%m #[bg=#bd93f9,fg=#282a36,bold] %H:%M "

# --- Painéis -------------------------------------------------------------

set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=#bd93f9"
set -g display-panes-colour "#6272a4"
set -g display-panes-active-colour "#bd93f9"

# Etiqueta no canto superior direito de cada painel com o nome da pasta atual
set -g pane-border-status top
set -g pane-border-format "#[align=right]#{?pane_active,#[bg=#282a36]#[fg=#ff79c6]#[bold]  ✦ #{b:pane_current_path}  ,#[bg=#282a36]#[fg=#8be9fd]#[bold]  ✧ #{b:pane_current_path}  }#[default] "

# --- Mensagens, menus e popups -------------------------------------------

set -g message-style "bg=#44475a,fg=#f8f8f2"
set -g message-command-style "bg=#44475a,fg=#f8f8f2"
set -g menu-style "bg=#282a36,fg=#f8f8f2"
set -g menu-selected-style "bg=#44475a,fg=#ff79c6"
set -g menu-border-style "fg=#bd93f9"
set -g popup-border-style "fg=#bd93f9"

# --- Modo cópia e relógio ------------------------------------------------

# seleção na cor de seleção do Dracula; resultados de busca em destaque
set -g mode-style "bg=#44475a,fg=#f8f8f2"
set -g copy-mode-match-style "bg=#6272a4,fg=#f8f8f2"
set -g copy-mode-current-match-style "bg=#f1fa8c,fg=#282a36"
set -g clock-mode-colour "#bd93f9"

# --- Mouse e seleção -----------------------------------------------------

set -g mouse on

# Ao soltar o arraste: copia para a área de transferência (pbcopy) e mantém a seleção visível
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "pbcopy"

# Ao dar um clique simples: limpa a seleção e sai do copy-mode na hora
bind -T copy-mode    MouseDown1Pane select-pane \; send-keys -X cancel
bind -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X cancel
